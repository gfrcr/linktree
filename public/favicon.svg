<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded green tile: reads as a solid shape even at 16px -->
  <rect width="64" height="64" rx="16" fill="#7BA471"/>

  <!-- Four-petal flower in blush. Kept chunky on purpose so it -->
  <!-- survives downscaling to the 16px browser tab size. -->
  <g fill="#FBE3E8">
    <circle cx="32" cy="19" r="10.5"/>
    <circle cx="32" cy="45" r="10.5"/>
    <circle cx="19" cy="32" r="10.5"/>
    <circle cx="45" cy="32" r="10.5"/>
  </g>

  <!-- Center, in the deep green so it punches through the petals -->
  <circle cx="32" cy="32" r="7" fill="#4E7247"/>
</svg>
